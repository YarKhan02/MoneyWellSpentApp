name: money_well_spent
description: Private, offline-first expense tracking by Shoukan Labs.
publish_to: none
version: 1.0.2+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^11.1.0
  cross_file: ^0.3.4+2
  fl_chart: ^1.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/09_android_launcher_forest.png
  adaptive_icon_background: "#327039"
  adaptive_icon_foreground: assets/10_android_adaptive_foreground_transparent.png
  remove_alpha_ios: true
