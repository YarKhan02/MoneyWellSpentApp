
name: Android Production Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Deploy to Google Play Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Restore signing config
        # build.gradle.kts reads the release signingConfig from android/key.properties
        # (storeFile is resolved relative to android/app). Without this file the release
        # build silently falls back to the debug key and Play rejects the upload.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Derive version from the tag
        id: version
        # versionName = the tag without its leading "v" (v1.2.3 -> 1.2.3).
        # versionCode = the monotonic GitHub run number, so it always increases.
        # Nothing is read from pubspec.yaml -- to release, you only push a tag;
        # you never edit the version in the repo.
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Releasing versionName=${GITHUB_REF_NAME#v} versionCode=${GITHUB_RUN_NUMBER}"

      - name: Build signed AAB
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      - name: Upload to Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shoukanlabs.moneywellspent
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          # Full 100% rollout. For a staged rollout instead, use:
          #   status: inProgress
          #   userFraction: 0.2
